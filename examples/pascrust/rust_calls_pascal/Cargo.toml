# A Rust program that uses a Turbo Pascal unit: the binary search tree in
# examples/database/bstunit.pas, written in 1997. `build.rs` runs PascRust
# on it whenever it changes, so `cargo run` is all it takes.
[package]
name = "rust_calls_pascal"
version = "0.1.0"
edition = "2024"

# Not part of PascRust's own workspace.
[workspace]

[dependencies]
# From PascRust's repository, a program would say
# `pascrust_runtime = { git = "https://github.com/jjinux/pascrust", rev = "..." }`.
pascrust_runtime = { path = "../../../crates/pascrust_runtime" }

[build-dependencies]
# The same `rev` as the runtime; `default-features = false` leaves out the
# command-line tools.
pascrust = { path = "../../../crates/pascrust", default-features = false }

# Turbo Pascal's integer arithmetic wraps around; Rust's would stop with an
# error in a debug build. The Pascal code is compiled in this crate, so turn
# overflow checks off here (or leave them on, and PascRust warns).
[profile.dev]
overflow-checks = false

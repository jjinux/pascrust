name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The `graph` feature's window library (minifb) links against X11 and
      # Wayland. The tests themselves draw headless.
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcursor-dev libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Generated programs turn on only the units they use, and must build
      # without warnings, so check each feature on its own too.
      - run: for f in crt dos graph; do cargo clippy -p pascrust_runtime --features $f -- -D warnings; done
      - run: cargo test --workspace
      - run: cargo test -p pascrust_runtime --all-features

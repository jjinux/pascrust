[package]
name = "pascrust"
description = "PascRust: a Turbo Pascal to Rust transpiler"
# `src/bin/tpc.rs` is a second binary; `cargo run -p pascrust` means this one.
default-run = "pascrust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# The command-line tools. A Rust project that uses PascRust only as a build
# dependency (`pascrust::build` in its `build.rs`) turns this off, with
# `default-features = false`, and doesn't build `clap`.
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "pascrust"
required-features = ["cli"]

[[bin]]
name = "tpc"
required-features = ["cli"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
insta = { version = "1", features = ["glob"] }

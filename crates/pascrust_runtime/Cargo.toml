[package]
name = "pascrust_runtime"
description = "Runtime library for Rust programs generated by pascrust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Each feature corresponds to a Turbo Pascal unit. Codegen turns on exactly
# the features that a program's `uses` clauses need.
crt = []
dos = []
graph = []
